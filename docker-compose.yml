version: '3.8'

services:
  mock-oidc-provider:
    build: .
    container_name: mock-oidc-provider
    ports:
      - "3000:3000"
    environment:
      # Server configuration
      PORT: 3000
      NODE_ENV: production

      # Optional: HTTP Basic Authentication
      # WEB_USER: admin
      # WEB_PASS: password

      # Optional: URL routing configuration
      # BASE_PATHNAME: /oidc
      # BASE_URL: https://your-domain.com

      # OAuth Client Configuration (Required)
      # Option 1: Set directly (not recommended for secrets)
      # MOCK_CLIENT_ID: "your-client-id"
      # MOCK_CLIENT_SECRET: "your-client-secret"
      # MOCK_REDIRECT_URI: "http://localhost:4200/api/auth/callback"

      # Option 2: Reference from .env file (recommended)
      MOCK_CLIENT_ID: "${MOCK_CLIENT_ID}"
      MOCK_CLIENT_SECRET: "${MOCK_CLIENT_SECRET}"
      MOCK_REDIRECT_URI: "${MOCK_REDIRECT_URI}"
    volumes:
      # Persist configuration data
      - ./data:/app/data
    restart: unless-stopped
    # Reap zombies and forward signals (the hardened image ships no init)
    init: true
    # Allow in-flight requests to finish before Docker resorts to SIGKILL
    stop_grace_period: 30s
